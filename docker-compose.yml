name: roz

x-monitor-common: &monitor-common
  build:
    context: .
    dockerfile: services/earnings_monitor/Dockerfile
  platform: ${DOCKER_PLATFORM:-linux/amd64}
  env_file:
    - ${EARNINGS_MONITOR_ENV_FILE:-services/earnings_monitor/.env.example}
  environment:
    DATA_DIR: /data
    EARNINGS_MONITOR_REPO_ROOT: /app
    EARNINGS_MONITOR_DB: /data/monitor.sqlite3
    EARNINGS_MONITOR_DATASET: /data/company_quarters.parquet
    EARNINGS_MONITOR_HISTORY_SOURCE: /history-source/output
    EARNINGS_SCRAPER_INBOX: /app/earnings-scraper-main/earnings-scraper-main/inbox
    EARNINGS_MONITOR_EVENT_MANIFESTS: /app/earnings-scraper-main/earnings-scraper-main/inbox/events
  volumes:
    - monitor-data:/data
    - ./earnings-scraper-main/earnings-scraper-main/inbox:/app/earnings-scraper-main/earnings-scraper-main/inbox
    - type: bind
      source: ${STRUCTURED_NARRATIVE_ENV_FILE:-./Structured Narrative/.env}
      target: /app/Structured Narrative/.env
      read_only: true
    # Repo-root .env (Anthropic, etc.). Monitor knobs stay in env_file above —
    # do not point this at services/earnings_monitor/.env*.
    - type: bind
      source: ${REPO_ENV_FILE:-./.env}
      target: /app/.env
      read_only: true
    # Fiscal calendars + sector book (Onboard / First-Print append tickers).
    - type: bind
      source: ./config
      target: /app/config
    # Company overlays (get_company lazy-load); must be writable for onboard.
    - type: bind
      source: ./Structured Narrative/config
      target: /app/Structured Narrative/config
    - type: bind
      source: ${STRUCTURED_NARRATIVE_TRANSCRIPTS_DIR:-./Structured Narrative/transcripts_raw}
      target: /app/Structured Narrative/transcripts_raw
    - type: bind
      source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
      target: /history-source/output
      read_only: true
    # Same host tree as history-source. Without this, monitor keeps the
    # image-baked output/ (often AAPL + ZZZ* only) at this path and looks like
    # the universe is empty. Worker/research-regen override with a writable mount.
    - type: bind
      source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
      target: /app/Structured Narrative/output
      read_only: true
    # Live desk hook (walk + cue queue). Image bake can lag the repo.
    - type: bind
      source: ./services
      target: /app/services
    - type: bind
      source: ./scripts
      target: /app/scripts
  restart: unless-stopped

services:
  history-import:
    <<: *monitor-common
    command: ["history-import"]
    restart: "no"

  monitor:
    <<: *monitor-common
    command: ["monitor"]
    depends_on:
      mailpit:
        condition: service_started

  worker:
    <<: *monitor-common
    command: ["worker"]
    volumes:
      - monitor-data:/data
      - ./earnings-scraper-main/earnings-scraper-main/inbox:/app/earnings-scraper-main/earnings-scraper-main/inbox
      - type: bind
        source: ${STRUCTURED_NARRATIVE_ENV_FILE:-./Structured Narrative/.env}
        target: /app/Structured Narrative/.env
        read_only: true
      - type: bind
        source: ${REPO_ENV_FILE:-./.env}
        target: /app/.env
        read_only: true
      - type: bind
        source: ./config
        target: /app/config
      - type: bind
        source: ./Structured Narrative/config
        target: /app/Structured Narrative/config
      - type: bind
        source: ${STRUCTURED_NARRATIVE_TRANSCRIPTS_DIR:-./Structured Narrative/transcripts_raw}
        target: /app/Structured Narrative/transcripts_raw
      - type: bind
        source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
        target: /history-source/output
        read_only: true
      - type: bind
        source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
        target: /app/Structured Narrative/output
      - type: bind
        source: ./services
        target: /app/services
      - type: bind
        source: ./scripts
        target: /app/scripts
    depends_on:
      monitor:
        condition: service_healthy

  # Async Rank IC + consolidated HTML regen after post_call dirty flag.
  # Needs writable Structured Narrative/output (monitor history mount is RO).
  research-regen:
    <<: *monitor-common
    command: ["research-regen"]
    volumes:
      - monitor-data:/data
      - ./earnings-scraper-main/earnings-scraper-main/inbox:/app/earnings-scraper-main/earnings-scraper-main/inbox
      - type: bind
        source: ${STRUCTURED_NARRATIVE_ENV_FILE:-./Structured Narrative/.env}
        target: /app/Structured Narrative/.env
        read_only: true
      - type: bind
        source: ${REPO_ENV_FILE:-./.env}
        target: /app/.env
        read_only: true
      - type: bind
        source: ./config
        target: /app/config
      - type: bind
        source: ./Structured Narrative/config
        target: /app/Structured Narrative/config
      - type: bind
        source: ${STRUCTURED_NARRATIVE_TRANSCRIPTS_DIR:-./Structured Narrative/transcripts_raw}
        target: /app/Structured Narrative/transcripts_raw
      - type: bind
        source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
        target: /history-source/output
      - type: bind
        source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
        target: /app/Structured Narrative/output
    depends_on:
      monitor:
        condition: service_started

  dashboard:
    <<: *monitor-common
    command: ["dashboard"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - monitor-data:/data
      - ./earnings-scraper-main/earnings-scraper-main/inbox:/app/earnings-scraper-main/earnings-scraper-main/inbox
      - type: bind
        source: ${STRUCTURED_NARRATIVE_ENV_FILE:-./Structured Narrative/.env}
        target: /app/Structured Narrative/.env
        read_only: true
      - type: bind
        source: ${REPO_ENV_FILE:-./.env}
        target: /app/.env
        read_only: true
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
      - type: bind
        source: ./Structured Narrative/config
        target: /app/Structured Narrative/config
        read_only: true
      - type: bind
        source: ${STRUCTURED_NARRATIVE_TRANSCRIPTS_DIR:-./Structured Narrative/transcripts_raw}
        target: /app/Structured Narrative/transcripts_raw
        read_only: true
      - type: bind
        source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
        target: /history-source/output
        read_only: true
      - type: bind
        source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}
        target: /app/Structured Narrative/output
        read_only: true
      # Live dashboard Python (Claims Desk, Rank IC pages). The image does
      # not pick up host edits; without this, :8501 stays on the last build.
      - type: bind
        source: ./services
        target: /app/services
        read_only: true
      - type: bind
        source: ./scripts
        target: /app/scripts
        read_only: true
      - type: bind
        source: ./services/earnings_monitor/dashboard
        target: /app/services/earnings_monitor/dashboard
        read_only: true
      # Scorecard sidecar, post-call briefs, and other host-generated artefacts.
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      # Mount reports where Streamlit static serving expects them (no symlink).
      - type: bind
        source: ${STRUCTURED_NARRATIVE_OUTPUT_DIR:-./Structured Narrative/output}/cross_company/reports
        target: /app/services/earnings_monitor/dashboard/static/reports
        read_only: true
    depends_on:
      history-import:
        condition: service_completed_successfully
      # Dashboard serves local history/ops state and must not wait on Snowflake
      # connectivity inside the monitor health gate.
      monitor:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    profiles: ["cloudflare"]
    env_file:
      - ${EARNINGS_MONITOR_ENV_FILE:-services/earnings_monitor/.env.example}
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-not-configured}
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

volumes:
  monitor-data:
  mailpit-data:
